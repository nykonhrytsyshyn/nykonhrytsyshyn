# ============================================================================ #
#                       Streak Stats Generation Workflow                       #
# ============================================================================ #
# This workflow generates streak stats using the specified action and          #
# pushes the generated files to the output branch.                             #
#                                                                              #
# Key Specifications:                                                          #
#   - scheduled:     Runs every 12 hours at minute 0                           #
#   - output branch: 'output'                                                  #
#   - output files:  'dist/streak-stats.svg'                                   #
#                    'dist/streak-stats-light.svg'                             #
#                                                                              #
# Action: https://github.com/DenverCoder1/github-readme-streak-stats           #
# ============================================================================ #

name: "Streak Stats"

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  schedule:
    # Runs every 12 hours at minute 0
    - cron: "0 */12 * * *"

jobs:
  # Generate streak stats
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: "Setup: Checkout repository"
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: "Run: Generate streak stats (dark)"
        uses: DenverCoder1/github-readme-streak-stats@v1.7.0
        with:
          options: "user=${{ github.repository_owner }}&theme=dark&border=3d444d78&border_radius=15&ring=fff&fire=fff&currStreakNum=fff&stroke=fff&sideNums=fff&currStreakLabel=fff&background=39363f1e"
          path: "dist/streak-stats.svg"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Run: Generate streak stats (light)"
        uses: DenverCoder1/github-readme-streak-stats@v1.7.0
        with:
          options: "user=${{ github.repository_owner }}&border=dbe3eab3&border_radius=15&ring=363636&fire=363636&currStreakNum=363636&stroke=363636&sideNums=363636&currStreakLabel=363636&background=c5c5c91e"
          path: "dist/streak-stats-light.svg"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Run: Push generated files to 'output' branch"
        uses: crazy-max/ghaction-github-pages@v4.2.0
        with:
          target_branch: "output"
          build_dir: "dist"
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
