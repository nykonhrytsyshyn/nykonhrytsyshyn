# ============================================================================ #
#                       Profile Readme Assets Generation                       #
# ============================================================================ #
# This workflow generates the activity graph, snake animation, profile stats,  #
# and streak stats, then pushes all generated files to the output branch.      #
#                                                                              #
# Key Specifications:                                                          #
#   - scheduled:     Runs every 12 hours at minute 0                           #
#   - output branch: 'output'                                                  #
#   - output dir:    'assets/profile/'                                         #
#   - output files:  'assets/profile/activity-graph.svg'                       #
#                    'assets/profile/activity-graph-light.svg'                 #
#                    'assets/profile/contr-grid-snake.svg'                     #
#                    'assets/profile/contr-grid-snake-light.svg'               #
#                    'assets/profile/stats.svg'                                #
#                    'assets/profile/stats-light.svg'                          #
#                    'assets/profile/streak-stats.svg'                         #
#                    'assets/profile/streak-stats-light.svg'                   #
#                                                                              #
# Actions:                                                                     #
#   - https://github.com/Platane/snk                                           #
#   - https://github.com/maurodesouza/github-readme-activity-graph-action      #
#   - https://github.com/stats-organization/github-readme-stats-action         #
#   - https://github.com/DenverCoder1/github-readme-streak-stats               #
# ============================================================================ #

name: "Profile Readme Assets"

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths-ignore: [ "assets/profile/**" ]
  schedule:
    # Runs every 12 hours at minute 0
    - cron: "0 */12 * * *"

# Prevents overlapping runs of this workflow itself
concurrency:
  group: profile-readme-assets
  cancel-in-progress: false

jobs:
  # Generate svg assets for profile readme
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: "Setup: Checkout repository"
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      # Snake animation
      - name: "Run: Generate snake animation"
        uses: Platane/snk@v3.4.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/profile/contr-grid-snake.svg?color_snake=#ffffff&color_dots=#161b22,#4d525a,#6e7681,#8b949e,#f0f6fc
            assets/profile/contr-grid-snake-light.svg?color_snake=#000000&color_dots=#d8dde2,#787b7e,#606264,#48494b,#303132

      # Activity graph
      - name: "Run: Generate activity graph (dark)"
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          token: ${{ secrets.STATS_PAT }}
          username: ${{ github.repository_owner }}
          options: "bg_color=39363f1e&color=fff&line=d9d9d9&point=fff&border_color=3d444db3&radius=20&hide_title=true"
          output_path: "assets/profile/activity-graph.svg"

      - name: "Run: Generate activity graph (light)"
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          token: ${{ secrets.STATS_PAT }}
          username: ${{ github.repository_owner }}
          options: "bg_color=c5c5c91e&color=363636&line=646464&point=363636&border_color=d1d9e0b3&radius=20&hide_title=true"
          output_path: "assets/profile/activity-graph-light.svg"

      # Profile stats
      - name: "Run: Generate profile stats (dark)"
        uses: stats-organization/github-readme-stats-action@v2
        with:
          token: ${{ secrets.STATS_PAT }}
          card: stats
          options: "username=${{ github.repository_owner }}&icon_color=fff&border_color=3d444d78&show_icons=true&theme=dark&border_radius=15&bg_color=39363f1e&title_color=fff&hide_title=true&line_height=28"
          path: "assets/profile/stats.svg"

      - name: "Run: Generate profile stats (light)"
        uses: stats-organization/github-readme-stats-action@v2
        with:
          token: ${{ secrets.STATS_PAT }}
          card: stats
          options: "username=${{ github.repository_owner }}&icon_color=363636&border_color=dbe3eab3&show_icons=true&border_radius=15&bg_color=c5c5c91e&title_color=363636&hide_title=true&line_height=28"
          path: "assets/profile/stats-light.svg"

      # Streak stats
      - name: "Run: Generate streak stats (dark)"
        uses: DenverCoder1/github-readme-streak-stats@v1.7.0
        with:
          token: ${{ secrets.STATS_PAT }}
          options: "user=${{ github.repository_owner }}&theme=dark&border=3d444d78&border_radius=15&ring=fff&fire=fff&currStreakNum=fff&stroke=fff&sideNums=fff&currStreakLabel=fff&background=39363f1e"
          path: "assets/profile/streak-stats.svg"

      - name: "Run: Generate streak stats (light)"
        uses: DenverCoder1/github-readme-streak-stats@v1.7.0
        with:
          token: ${{ secrets.STATS_PAT }}
          options: "user=${{ github.repository_owner }}&border=dbe3eab3&border_radius=15&ring=363636&fire=363636&currStreakNum=363636&stroke=363636&sideNums=363636&currStreakLabel=363636&background=c5c5c91e"
          path: "assets/profile/streak-stats-light.svg"

      # Publish
      - name: "Run: Push generated assets to output branch"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Setting up git user for committing changes
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Temporary saving of generated assets to avoid their loss when switching branches
          mkdir -p /tmp/profile-assets
          cp -r assets/profile/* /tmp/profile-assets/

          # Switching to the output branch (or creating it if it doesn't exist)
          git fetch origin output:output || true
          git checkout output || git checkout -b output

          # Restoring files to the target directory assets/profile/
          mkdir -p assets/profile
          cp -r /tmp/profile-assets/* assets/profile/

          # Staging changes
          git add assets/profile/

          # Checking for changes before committing
          if git diff --staged --quiet; then
            echo "No changes in generated profile assets. Skipping commit."
          else
            git commit -m "[skip ci] Auto-generate readme profile assets"
            git push origin output
          fi
