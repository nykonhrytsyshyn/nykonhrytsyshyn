# ============================================================================ #
#                      Activity Graph Generation Workflow                      #
# ============================================================================ #
# This workflow generates an activity graph using the specified action and     #
# pushes the generated files to the output branch.                             #
#                                                                              #
# Key Specifications:                                                          #
#   - scheduled:     Runs every 12 hours at minute 0                           #
#   - output branch: 'output'                                                  #
#   - output files:  'dist/activity-graph.svg'                                 #
#                    'dist/activity-graph-light.svg'                           #
#                                                                              #
# Action: https://github.com/maurodesouza/github-readme-activity-graph-action  #
# ============================================================================ #

name: "Activity Graph"

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  schedule:
    # Runs every 12 hours at minute 0
    - cron: "0 */12 * * *"

jobs:
  # Generate activity graph
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: "Setup: Checkout repository"
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: "Run: Generate activity graph (dark)"
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          options: "bg_color=39363f1e&color=fff&line=d9d9d9&point=fff&border_color=3d444db3&radius=20&hide_title=true"
          output_path: "dist/activity-graph.svg"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Run: Generate activity graph (light)"
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          options: "bg_color=c5c5c91e&color=363636&line=646464&point=363636&border_color=d1d9e0b3&radius=20&hide_title=true"
          output_path: "dist/activity-graph-light.svg"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Run: Push generated files to 'output' branch"
        uses: crazy-max/ghaction-github-pages@v4.2.0
        with:
          target_branch: "output"
          build_dir: "dist"
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
