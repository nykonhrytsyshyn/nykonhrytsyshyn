  <style>
    :root {
      --color-bg: #c5c5c91e;
      --color-border: #dbe3eab3;
      --color-text: #000;
      --color-icon: #262626;
    }

    .card {
      fill: var(--color-bg);
      stroke: var(--color-border);
      stroke-width: 0.75;
      rx: 10;
      ry: 10;
    }

    .icon {
      fill: var(--color-icon);
    }

    .label {
      fill: var(--color-text);
    }

    .icon, .label {
      animation: fadeIn 1.2s ease-in-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
  </style>

