<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300.967 60.679">
  <style>
    :root {
      --color-bg: #39363f1e;
      --color-border: #3d444d78;
      --color-text: #9f9f9f;
      --color-icon: #8b949e;
    }

    .card {
      fill: var(--color-bg);
      stroke: var(--color-border);
      stroke-width: 0.75;
      rx: 10;
      ry: 10;
    }

    .icon {
      fill: var(--color-icon);
    }

    .label {
      fill: var(--color-text);
    }

    .icon, .label {
      animation: fadeIn 1.2s ease-in-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
  </style>

