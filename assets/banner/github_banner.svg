<svg xmlns="http://www.w3.org/2000/svg" width="854" height="200" viewBox="0 0 854 200">
  <style>
    .text {
      fill: #ffffff;
      font-size: 60px;
      font-weight: 700;
      font-family: -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif,Apple Color Emoji,Segoe UI Emoji;
    }

    .desc {
      fill: #e6edf3;
      font-size: 13px;
      font-weight: 500;
      font-family: -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif,Apple Color Emoji,Segoe UI Emoji;
    }

    .text, .desc {
      animation: fadeIn 1.2s ease-in-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
  </style>

  <defs>
    <linearGradient id="linear" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30363d"/>
      <stop offset="100%" stop-color="#21262d"/>
    </linearGradient>

    <clipPath id="top-rounded-clip">
      <path d="M 0 15 A 15 15 0 0 1 15 0 L 839 0 A 15 15 0 0 1 854 15 L 854 200 L 0 200 Z" />
    </clipPath>
  </defs>

  <g clip-path="url(#top-rounded-clip)">
    <g transform="translate(427, 100) scale(1, 1) translate(-427, -100)">
      <path d="" fill="url(#linear)" opacity="0.6">
        <animate
          attributeName="d"
          dur="20s"
          repeatCount="indefinite"
          keyTimes="0;0.333;0.667;1"
          keySplines="0.2 0 0.2 1;0.2 0 0.2 1;0.2 0 0.2 1"
          begin="0s"
          values="M0 0L 0 120Q 213.5 160 427 130T 854 155L 854 0 Z;M0 0L 0 145Q 213.5 160 427 140T 854 130L 854 0 Z;M0 0L 0 165Q 213.5 135 427 165T 854 130L 854 0 Z;M0 0L 0 120Q 213.5 160 427 130T 854 155L 854 0 Z"
        />
      </path>
      <path d="" fill="url(#linear)" opacity="0.4">
        <animate
          attributeName="d"
          dur="20s"
          repeatCount="indefinite"
          keyTimes="0;0.333;0.667;1"
          keySplines="0.2 0 0.2 1;0.2 0 0.2 1;0.2 0 0.2 1"
          begin="-10s"
          values="M0 0L 0 135Q 213.5 180 427 150T 854 160L 854 0 Z;M0 0L 0 150Q 213.5 120 427 120T 854 140L 854 0 Z;M0 0L 0 145Q 213.5 125 427 150T 854 165L 854 0 Z;M0 0L 0 135Q 213.5 180 427 150T 854 160L 854 0 Z"
        />
      </path>
    </g>

    <text
      text-anchor="middle"
      dominant-baseline="middle"
      x="50%"
      y="32%"
      class="text"
    >
      Nykon
    </text>
    <text
      text-anchor="middle"
      dominant-baseline="middle"
      x="50%"
      y="52%"
      class="desc"
    >
      Software and Mechanical Engineer • Open Source • Social Media
    </text>
  </g>
